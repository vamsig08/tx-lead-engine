[project]
name = "tx-lead-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
